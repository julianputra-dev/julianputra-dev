<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="100%" height="200" fill="none">
  <style>
    <![CDATA[
    .txt {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace;
      font-weight: 800;
      font-size: 36px;
      letter-spacing: 0.5px;
    }

    .locked { fill: #F0F6FC; }
    .cursor-char { fill: #E63946; }
    .noise { fill: #7D8590; }

    /* =====================================================================
       TIMELINE: 10s Total Cycle (Pure CSS steps(1, end) Frame-by-Frame)
       0.0% - 28.0%  : Julian Putra Dhanurrullah (Stabil)
       28.0% - 34.0% : HEAVY GLITCH (Nama hancur jadi huruf/angka/simbol acak)
       34.0% - 48.0% : DECODE BERTAHAP -> Full-Stack Web Developer
       48.0% - 74.0% : Full-Stack Web Developer (Stabil)
       74.0% - 80.0% : HEAVY GLITCH (Keahlian hancur jadi karakter acak)
       80.0% - 92.0% : DECODE BERTAHAP -> Julian Putra Dhanurrullah
       92.0% - 100%  : Julian Putra Dhanurrullah (Stabil, looping mulus)
       ===================================================================== */

    /* --- BASE STABLE STATES --- */
    @keyframes show-name {
      0%, 27.99% { opacity: 1; }
      28%, 91.99% { opacity: 0; }
      92%, 100% { opacity: 1; }
    }
    @keyframes show-skill {
      0%, 47.99% { opacity: 0; }
      48%, 73.99% { opacity: 1; }
      74%, 100% { opacity: 0; }
    }

    /* --- HEAVY GLITCH 1 (NAME -> CHAOS) --- */
    @keyframes g1 { 0%, 27.99% { opacity: 0; } 28%, 28.99% { opacity: 1; } 29%, 100% { opacity: 0; } }
    @keyframes g2 { 0%, 28.99% { opacity: 0; } 29%, 29.99% { opacity: 1; } 30%, 100% { opacity: 0; } }
    @keyframes g3 { 0%, 29.99% { opacity: 0; } 30%, 30.99% { opacity: 1; } 31%, 100% { opacity: 0; } }
    @keyframes g4 { 0%, 30.99% { opacity: 0; } 31%, 31.99% { opacity: 1; } 32%, 100% { opacity: 0; } }
    @keyframes g5 { 0%, 31.99% { opacity: 0; } 32%, 32.99% { opacity: 1; } 33%, 100% { opacity: 0; } }
    @keyframes g6 { 0%, 32.99% { opacity: 0; } 33%, 33.99% { opacity: 1; } 34%, 100% { opacity: 0; } }

    /* --- PROGRESSIVE DECODE -> SKILL --- */
    @keyframes d1 { 0%, 33.99% { opacity: 0; } 34%, 35.74% { opacity: 1; } 35.75%, 100% { opacity: 0; } }
    @keyframes d2 { 0%, 35.74% { opacity: 0; } 35.75%, 37.49% { opacity: 1; } 37.5%, 100% { opacity: 0; } }
    @keyframes d3 { 0%, 37.49% { opacity: 0; } 37.5%, 39.24% { opacity: 1; } 39.25%, 100% { opacity: 0; } }
    @keyframes d4 { 0%, 39.24% { opacity: 0; } 39.25%, 40.99% { opacity: 1; } 41%, 100% { opacity: 0; } }
    @keyframes d5 { 0%, 40.99% { opacity: 0; } 41%, 42.74% { opacity: 1; } 42.75%, 100% { opacity: 0; } }
    @keyframes d6 { 0%, 42.74% { opacity: 0; } 42.75%, 44.49% { opacity: 1; } 44.5%, 100% { opacity: 0; } }
    @keyframes d7 { 0%, 44.49% { opacity: 0; } 44.5%, 46.24% { opacity: 1; } 46.25%, 100% { opacity: 0; } }
    @keyframes d8 { 0%, 46.24% { opacity: 0; } 46.25%, 47.99% { opacity: 1; } 48%, 100% { opacity: 0; } }

    /* --- HEAVY GLITCH 2 (SKILL -> CHAOS) --- */
    @keyframes r1 { 0%, 73.99% { opacity: 0; } 74%, 74.99% { opacity: 1; } 75%, 100% { opacity: 0; } }
    @keyframes r2 { 0%, 74.99% { opacity: 0; } 75%, 75.99% { opacity: 1; } 76%, 100% { opacity: 0; } }
    @keyframes r3 { 0%, 75.99% { opacity: 0; } 76%, 76.99% { opacity: 1; } 77%, 100% { opacity: 0; } }
    @keyframes r4 { 0%, 76.99% { opacity: 0; } 77%, 77.99% { opacity: 1; } 78%, 100% { opacity: 0; } }
    @keyframes r5 { 0%, 77.99% { opacity: 0; } 78%, 78.99% { opacity: 1; } 79%, 100% { opacity: 0; } }
    @keyframes r6 { 0%, 78.99% { opacity: 0; } 79%, 79.99% { opacity: 1; } 80%, 100% { opacity: 0; } }

    /* --- PROGRESSIVE DECODE -> NAME --- */
    @keyframes n1 { 0%, 79.99% { opacity: 0; } 80%, 81.49% { opacity: 1; } 81.5%, 100% { opacity: 0; } }
    @keyframes n2 { 0%, 81.49% { opacity: 0; } 81.5%, 82.99% { opacity: 1; } 83%, 100% { opacity: 0; } }
    @keyframes n3 { 0%, 82.99% { opacity: 0; } 83%, 84.49% { opacity: 1; } 84.5%, 100% { opacity: 0; } }
    @keyframes n4 { 0%, 84.49% { opacity: 0; } 84.5%, 85.99% { opacity: 1; } 86%, 100% { opacity: 0; } }
    @keyframes n5 { 0%, 85.99% { opacity: 0; } 86%, 87.49% { opacity: 1; } 87.5%, 100% { opacity: 0; } }
    @keyframes n6 { 0%, 87.49% { opacity: 0; } 87.5%, 88.99% { opacity: 1; } 89%, 100% { opacity: 0; } }
    @keyframes n7 { 0%, 88.99% { opacity: 0; } 89%, 90.49% { opacity: 1; } 90.5%, 100% { opacity: 0; } }
    @keyframes n8 { 0%, 90.49% { opacity: 0; } 90.5%, 91.99% { opacity: 1; } 92%, 100% { opacity: 0; } }

    /* --- HEAVY SCREEN SHAKE & TEAR DURING GLITCH --- */
    @keyframes heavy-shake {
      0%, 27.9% { transform: translate(0, 0); }
      28% { transform: translate(-14px, 3px); }
      29% { transform: translate(16px, -4px); }
      30% { transform: translate(-20px, -2px); }
      31% { transform: translate(18px, 4px); }
      32% { transform: translate(-12px, -3px); }
      33% { transform: translate(10px, 2px); }
      34% { transform: translate(-4px, 0); }
      35.5%, 73.9% { transform: translate(0, 0); }
      74% { transform: translate(14px, -3px); }
      75% { transform: translate(-18px, 4px); }
      76% { transform: translate(20px, -2px); }
      77% { transform: translate(-16px, -4px); }
      78% { transform: translate(12px, 3px); }
      79% { transform: translate(-10px, -2px); }
      80% { transform: translate(4px, 0); }
      81.5%, 100% { transform: translate(0, 0); }
    }

    /* --- CHROMATIC ECHO LAYERS (CRIMSON & SILVER) --- */
    @keyframes ghost-red {
      0%, 27.9% { opacity: 0; transform: translate(0, 0); }
      28% { opacity: 0.9; transform: translate(-12px, -3px); }
      29.5% { opacity: 0.95; transform: translate(14px, 2px); }
      31% { opacity: 1; transform: translate(-18px, 4px); }
      32.5% { opacity: 0.85; transform: translate(12px, -3px); }
      34% { opacity: 0.5; transform: translate(-6px, 0); }
      35.5%, 73.9% { opacity: 0; transform: translate(0, 0); }
      74% { opacity: 0.9; transform: translate(12px, 3px); }
      75.5% { opacity: 0.95; transform: translate(-15px, -2px); }
      77% { opacity: 1; transform: translate(18px, -4px); }
      78.5% { opacity: 0.85; transform: translate(-12px, 3px); }
      80% { opacity: 0.5; transform: translate(6px, 0); }
      81.5%, 100% { opacity: 0; transform: translate(0, 0); }
    }

    @keyframes ghost-silver {
      0%, 27.9% { opacity: 0; transform: translate(0, 0); }
      28% { opacity: 0.8; transform: translate(12px, 3px); }
      29.5% { opacity: 0.85; transform: translate(-14px, -2px); }
      31% { opacity: 0.9; transform: translate(16px, -4px); }
      32.5% { opacity: 0.75; transform: translate(-10px, 3px); }
      34% { opacity: 0.4; transform: translate(6px, 0); }
      35.5%, 73.9% { opacity: 0; transform: translate(0, 0); }
      74% { opacity: 0.8; transform: translate(-12px, -3px); }
      75.5% { opacity: 0.85; transform: translate(15px, 2px); }
      77% { opacity: 0.9; transform: translate(-16px, 4px); }
      78.5% { opacity: 0.75; transform: translate(10px, -3px); }
      80% { opacity: 0.4; transform: translate(-6px, 0); }
      81.5%, 100% { opacity: 0; transform: translate(0, 0); }
    }

    /* --- CHUNKY GLITCH SLICE BARS & CUTOUTS --- */
    @keyframes bars-burst {
      0%, 27.9% { opacity: 0; transform: translateY(0); }
      28% { opacity: 1; transform: translateY(-18px); }
      29.2% { opacity: 1; transform: translateY(14px); }
      30.4% { opacity: 1; transform: translateY(-6px); }
      31.6% { opacity: 1; transform: translateY(22px); }
      32.8% { opacity: 1; transform: translateY(-14px); }
      34% { opacity: 0.7; transform: translateY(8px); }
      35.2%, 73.9% { opacity: 0; transform: translateY(0); }
      74% { opacity: 1; transform: translateY(16px); }
      75.2% { opacity: 1; transform: translateY(-14px); }
      76.4% { opacity: 1; transform: translateY(8px); }
      77.6% { opacity: 1; transform: translateY(-20px); }
      78.8% { opacity: 1; transform: translateY(12px); }
      80% { opacity: 0.7; transform: translateY(-8px); }
      81.2%, 100% { opacity: 0; transform: translateY(0); }
    }

    /* Apply animations */
    .stage { animation: heavy-shake 10s steps(1, end) infinite; }
    .echo-red { animation: ghost-red 10s steps(1, end) infinite; }
    .echo-silver { animation: ghost-silver 10s steps(1, end) infinite; }
    .glitch-bars { animation: bars-burst 10s steps(1, end) infinite; }

    .f-name  { animation: show-name 10s steps(1, end) infinite; }
    .f-skill { animation: show-skill 10s steps(1, end) infinite; }

    .f-g1 { animation: g1 10s steps(1, end) infinite; }
    .f-g2 { animation: g2 10s steps(1, end) infinite; }
    .f-g3 { animation: g3 10s steps(1, end) infinite; }
    .f-g4 { animation: g4 10s steps(1, end) infinite; }
    .f-g5 { animation: g5 10s steps(1, end) infinite; }
    .f-g6 { animation: g6 10s steps(1, end) infinite; }

    .f-d1 { animation: d1 10s steps(1, end) infinite; }
    .f-d2 { animation: d2 10s steps(1, end) infinite; }
    .f-d3 { animation: d3 10s steps(1, end) infinite; }
    .f-d4 { animation: d4 10s steps(1, end) infinite; }
    .f-d5 { animation: d5 10s steps(1, end) infinite; }
    .f-d6 { animation: d6 10s steps(1, end) infinite; }
    .f-d7 { animation: d7 10s steps(1, end) infinite; }
    .f-d8 { animation: d8 10s steps(1, end) infinite; }

    .f-r1 { animation: r1 10s steps(1, end) infinite; }
    .f-r2 { animation: r2 10s steps(1, end) infinite; }
    .f-r3 { animation: r3 10s steps(1, end) infinite; }
    .f-r4 { animation: r4 10s steps(1, end) infinite; }
    .f-r5 { animation: r5 10s steps(1, end) infinite; }
    .f-r6 { animation: r6 10s steps(1, end) infinite; }

    .f-n1 { animation: n1 10s steps(1, end) infinite; }
    .f-n2 { animation: n2 10s steps(1, end) infinite; }
    .f-n3 { animation: n3 10s steps(1, end) infinite; }
    .f-n4 { animation: n4 10s steps(1, end) infinite; }
    .f-n5 { animation: n5 10s steps(1, end) infinite; }
    .f-n6 { animation: n6 10s steps(1, end) infinite; }
    .f-n7 { animation: n7 10s steps(1, end) infinite; }
    .f-n8 { animation: n8 10s steps(1, end) infinite; }
    ]]>
  </style>

  <!-- Minimalist Dark Canvas -->
  <rect width="840" height="200" rx="8" fill="#0D1117" />
  <rect x="0.5" y="0.5" width="839" height="199" rx="7.5" fill="none" stroke="#21262D" stroke-width="1" />

  <!-- ==================== CHROMATIC GLITCH GHOST ECHOES ==================== -->
  <!-- Crimson Offset Echo -->
  <g class="echo-red">
    <text x="420" y="114" text-anchor="middle" class="txt" fill="#E63946">#9x@!7 %$=04 !#8^@*1?9/0</text>
  </g>
  <!-- Silver Offset Echo -->
  <g class="echo-silver">
    <text x="420" y="114" text-anchor="middle" class="txt" fill="#94A3B8">4$!#9x K0@%7 ^*!#2$9@!#?</text>
  </g>

  <!-- ==================== MAIN ANIMATED TEXT STAGE ==================== -->
  <g class="stage">
    <!-- STABLE: NAMA -->
    <text x="420" y="114" text-anchor="middle" class="txt locked f-name">Julian Putra Dhanurrullah</text>

    <!-- GLITCH 1: NAMA HANCUR JADI HURUF, ANGKA, SIMBOL ACAK -->
    <text x="420" y="114" text-anchor="middle" class="txt locked f-g1">Jul!4n P#tr@ Dh4n%rr#ll4h</text>
    <text x="420" y="114" text-anchor="middle" class="txt cursor-char f-g2">J%9!#n 0x7r@ $h4^*r#1!4#</text>
    <text x="420" y="114" text-anchor="middle" class="txt locked f-g3">#9x@!7 %$=04 !#8^@*1?9/0</text>
    <text x="420" y="114" text-anchor="middle" class="txt cursor-char f-g4">4$!#9x K0@%7 ^*!#2$9@!#?</text>
    <text x="420" y="114" text-anchor="middle" class="txt locked f-g5">~7#@$1 9x%!= /0?#4^@*8$1</text>
    <text x="420" y="114" text-anchor="middle" class="txt noise f-g6">F#9@!_ %7$=4 !0x@9#1?$~#</text>

    <!-- DECODE BERTAHAP: MENYUSUN -> Full-Stack Web Developer -->
    <text x="420" y="114" text-anchor="middle" class="txt f-d1"><tspan class="locked">Ful</tspan><tspan class="cursor-char">#</tspan><tspan class="noise">@!_$7% =3# !0x@9#1?$</tspan></text>
    <text x="420" y="114" text-anchor="middle" class="txt f-d2"><tspan class="locked">Full-S</tspan><tspan class="cursor-char">7</tspan><tspan class="noise">%4k W$# 8@x!9#p3?</tspan></text>
    <text x="420" y="114" text-anchor="middle" class="txt f-d3"><tspan class="locked">Full-Stac</tspan><tspan class="cursor-char">%</tspan><tspan class="noise"> W3# D$v@9#p3r</tspan></text>
    <text x="420" y="114" text-anchor="middle" class="txt f-d4"><tspan class="locked">Full-Stack W</tspan><tspan class="cursor-char">#</tspan><tspan class="noise">b D3v#10p@r</tspan></text>
    <text x="420" y="114" text-anchor="middle" class="txt f-d5"><tspan class="locked">Full-Stack Web </tspan><tspan class="cursor-char">D</tspan><tspan class="noise">3v#l0p@r</tspan></text>
    <text x="420" y="114" text-anchor="middle" class="txt f-d6"><tspan class="locked">Full-Stack Web Dev</tspan><tspan class="cursor-char">#</tspan><tspan class="noise">l0p3r</tspan></text>
    <text x="420" y="114" text-anchor="middle" class="txt f-d7"><tspan class="locked">Full-Stack Web Develo</tspan><tspan class="cursor-char">#</tspan><tspan class="noise">3r</tspan></text>
    <text x="420" y="114" text-anchor="middle" class="txt f-d8"><tspan class="locked">Full-Stack Web Develope</tspan><tspan class="cursor-char">7</tspan></text>

    <!-- STABLE: BIDANG KEAHLIAN -->
    <text x="420" y="114" text-anchor="middle" class="txt locked f-skill">Full-Stack Web Developer</text>

    <!-- GLITCH 2: KEAHLIAN HANCUR JADI HURUF, ANGKA, SIMBOL ACAK -->
    <text x="420" y="114" text-anchor="middle" class="txt locked f-r1">Fu!!-St@ck W3b D3v#l0p3r</text>
    <text x="420" y="114" text-anchor="middle" class="txt cursor-char f-r2">F#9!-0x@%k ^3# !$v9#10?r</text>
    <text x="420" y="114" text-anchor="middle" class="txt locked f-r3">%8#@!7 0x9$= !#4^@*2?1/8</text>
    <text x="420" y="114" text-anchor="middle" class="txt cursor-char f-r4">9$!#4x @0#%2 ^*!#7$1@!#?</text>
    <text x="420" y="114" text-anchor="middle" class="txt locked f-r5">~3#@$9 7x%!= /8?#2^@*4$0</text>
    <text x="420" y="114" text-anchor="middle" class="txt noise f-r6">J#9@!_ P7$=4 D0x@9#1?$~#</text>

    <!-- DECODE BERTAHAP: MENYUSUN KEMBALI -> Julian Putra Dhanurrullah -->
    <text x="420" y="114" text-anchor="middle" class="txt f-n1"><tspan class="locked">Jul</tspan><tspan class="cursor-char">!</tspan><tspan class="noise">9@ P$7!4 D#4^*r#1!4#?</tspan></text>
    <text x="420" y="114" text-anchor="middle" class="txt f-n2"><tspan class="locked">Julian</tspan><tspan class="cursor-char">#</tspan><tspan class="noise">P#7r@ D$4n%r#l!4h?</tspan></text>
    <text x="420" y="114" text-anchor="middle" class="txt f-n3"><tspan class="locked">Julian Put</tspan><tspan class="cursor-char">r</tspan><tspan class="noise">@ Dh4n%rr#l4h?</tspan></text>
    <text x="420" y="114" text-anchor="middle" class="txt f-n4"><tspan class="locked">Julian Putra </tspan><tspan class="cursor-char">D</tspan><tspan class="noise">h@n#rr$l!4h</tspan></text>
    <text x="420" y="114" text-anchor="middle" class="txt f-n5"><tspan class="locked">Julian Putra Dha</tspan><tspan class="cursor-char">n</tspan><tspan class="noise">#rr$ll4h</tspan></text>
    <text x="420" y="114" text-anchor="middle" class="txt f-n6"><tspan class="locked">Julian Putra Dhanur</tspan><tspan class="cursor-char">#</tspan><tspan class="noise">ull4h</tspan></text>
    <text x="420" y="114" text-anchor="middle" class="txt f-n7"><tspan class="locked">Julian Putra Dhanurrul</tspan><tspan class="cursor-char">!</tspan><tspan class="noise">4h</tspan></text>
    <text x="420" y="114" text-anchor="middle" class="txt f-n8"><tspan class="locked">Julian Putra Dhanurrulla</tspan><tspan class="cursor-char">#</tspan></text>
  </g>

  <!-- ==================== HEAVY HORIZONTAL GLITCH BARS & CUTOUTS ==================== -->
  <!-- Muncul HANYA saat puncak glitch untuk efek robekan visual yang kuat -->
  <g class="glitch-bars">
    <!-- Dark cutout bar (memotong teks secara nyata) -->
    <rect x="80" y="96" width="680" height="8" fill="#0D1117" />
    <!-- Bold Crimson Glitch Block -->
    <rect x="110" y="84" width="240" height="5" fill="#E63946" opacity="0.9" />
    <rect x="480" y="114" width="260" height="6" fill="#E63946" opacity="0.85" />
    <!-- Stark White Static Flash Bar -->
    <rect x="140" y="106" width="520" height="3" fill="#F0F6FC" opacity="0.9" />
    <rect x="260" y="76" width="160" height="3" fill="#F0F6FC" opacity="0.7" />
    <!-- Small Glitch Artifacts -->
    <rect x="95" y="122" width="48" height="10" fill="#E63946" opacity="0.8" />
    <rect x="690" y="88" width="56" height="9" fill="#F0F6FC" opacity="0.75" />
  </g>
</svg>
